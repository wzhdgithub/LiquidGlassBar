org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Miuix 0.9.3（液态玻璃所依赖的 miuix-blur）要求 compileSdk >= 37；
# AGP 8.13 官方仅测到 36.1，故用该属性放行。
# 注意：AGP 9 目前不可用——它内置 Kotlin 2.2.x，无法读取 Kotlin 2.4 编译的
# Miuix 元数据，且新 DSL 与经典 kotlin-android 插件不兼容。
android.suppressUnsupportedCompileSdk=37